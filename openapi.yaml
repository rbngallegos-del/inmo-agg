openapi: 3.1.1
info:
  title: Inmo Aggregator API
  version: "0.2.1"
  description: "API para buscar listados inmobiliarios normalizados (búsqueda abierta por tipo, precio y ciudad)."

servers:
  - url: https://inmo-agg.onrender.com

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /search:
    get:
      operationId: searchListings
      summary: "Buscar inmuebles normalizados"
      parameters:
        - name: cities
          in: query
          description: "Ciudades separadas por coma. Vacío = todas."
          required: false
          schema:
            type: string

        - name: min_price
          in: query
          description: "Precio mínimo (MXN)."
          required: false
          schema:
            type: integer
            minimum: 0

        - name: max_price
          in: query
          description: "Precio máximo (MXN)."
          required: false
          schema:
            type: integer
            minimum: 0

        - name: min_bedrooms
          in: query
          description: "Recámaras mínimas (solo aplica a casa/departamento)."
          required: false
          schema:
            type: integer
            minimum: 0

        - name: furnished
          in: query
          description: "true/false; omitir para cualquiera."
          required: false
          schema:
            type: boolean

        - name: property_types
          in: query
          description: "Tipos separados por coma: casa,departamento,terreno,local,oficina,bodega,otro"
          required: false
          schema:
            type: string

        - name: property_type
          in: query
          description: "DEPRECATED: usa 'property_types' (compatibilidad)."
          required: false
          schema:
            type: string

        - name: sources
          in: query
          description: "Fuentes separadas por coma (identificadores de adapters)."
          required: false
          schema:
            type: string

        - name: q
          in: query
          description: "Texto libre a buscar en el título."
          required: false
          schema:
            type: string

        - name: limit
          in: query
          description: "Límite de elementos (1-100)."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25

        - name: offset
          in: query
          description: "Desplazamiento/paginación (>= 0)."
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0

      responses:
        "200":
          description: "Resultados de búsqueda"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

components:
  schemas:
    Listing:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        price: { type: number }
        currency: { type: string, default: MXN }
        bedrooms: { type: integer, nullable: true }
        bathrooms: { type: number, nullable: true }
        type: { type: string }
        furnished: { type: boolean, nullable: true }
        location_city: { type: string, nullable: true }
        location_colonia: { type: string, nullable: true }
        url: { type: string }
        source: { type: string }
        photos:
          type: array
          items: { type: string }

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
        next_offset:
          type: integer
          nullable: true
