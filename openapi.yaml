openapi: 3.1.1
info:
  title: Inmo Aggregator API
  version: "0.2.0"
  description: "API para buscar listados inmobiliarios normalizados (búsqueda abierta por tipo, precio y ciudad)."
servers:
  - url: https://inmo-agg.onrender.com

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /search:
    get:
      operationId: searchListings
      summary: "Buscar inmuebles normalizados"
      parameters:
        - in: query
          name: cities
          schema:
            type: string
          description: "Ciudades separadas por coma. Vacío = todas."
        - in: query
          name: min_price
          schema:
            type: integer
            minimum: 0
        - in: query
          name: max_price
          schema:
            type: integer
            minimum: 0
        - in: query
          name: min_bedrooms
          schema:
            type: integer
            minimum: 0
        - in: query
          name: furnished
          schema:
